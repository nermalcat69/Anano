[workspace]
resolver = "3"
members = ["crates/anano-core", "crates/anano-app", "crates/gpui-tokio"]
# vendor 的第三方 crate 只作为依赖编译，不参与 --workspace 的 fmt / clippy / test（它有自己的 lint 与 doctest）
exclude = ["vendor/gpui-updater"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
anano-core = { path = "crates/anano-core" }

# GPUI 生态：按 GPUI Kit 0.6 的官方形态，应用只依赖 gpui-kit 这一个包（crates.io）。
# 它替我们锁定配套的 gpui（以 `gpui-pre` 系列发布的 zed 快照）、gpui-base、gpui-component 与默认图标。
# 代码里 `use gpui_kit::*` 就是 gpui，组件在 `gpui_kit::component`，平台层在 `gpui_kit::platform`，
# 图标在 `gpui_kit::assets`。tree-sitter 语言与 inspector 等 feature 名与 gpui-component 一致。
gpui-kit = { version = "0.6.1", features = ["tree-sitter", "tree-sitter-html", "tree-sitter-bash", "tree-sitter-python"] }
# tokio ⇄ gpui 桥接：Kit 没有对应的包（全线 smol），移植自 zed 的 gpui_tokio，见 crates/gpui-tokio
gpui-tokio = { path = "crates/gpui-tokio" }
# 应用内更新（GitHub Releases + SHA-256 + minisign）。上游的 gpui 走 zed git 源，与 gpui-pre 不是
# 同一个 crate，所以 vendor 一份只改 Cargo.toml 那一行；来源与差异见 vendor/gpui-updater/VENDOR.md。
gpui-updater = { path = "vendor/gpui-updater", features = ["gpui"] }

tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0"
# Git 集成（phase 1）：libgit2 绑定，默认 feature（系统 libgit2 / 打包的 vendored openssl 由
# libgit2-sys 自行决定），构建失败再考虑 `vendored-libgit2`。
git2 = "0.19"
# i18n：与 gpui-component 共用同一个 rust-i18n（set_locale 是跨 crate 的全局），sys-locale 读系统首选语言
rust-i18n = "4.2"
sys-locale = "0.3"
anyhow = "1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# 持久化：纯文件存储（spec §9）。ulid 3.0 的构造函数是 Ulid::generate()
directories = "6.0.0"
tempfile = "3.27.0"
ulid = { version = "3.0.0", features = ["serde"] }

[patch.crates-io]
# arrayref 0.3.5–0.3.9 已在 crates.io 被 yank（tiny-skia -> resvg -> gpui-component 传递依赖）
arrayref = { path = "vendor/arrayref" }

[profile.dev]
debug = "limited"

# 开发构建里只给渲染 / 文本 / 组件这一层开优化（官方 installation 文档的推荐清单 + 我们额外的 tree-sitter / ropey）
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-base = { opt-level = 3 }
tree-sitter = { opt-level = 3 }
ropey = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }

[profile.release]
lto = "thin"
